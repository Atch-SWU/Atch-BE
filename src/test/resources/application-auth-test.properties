# 공통 application.properties 및 .env를 로드하지 않는 테스트 전용 설정
spring.application.name=atch-auth-test
spring.config.import=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.sql.init.mode=never
app.jwt.issuer=https://atch.test.invalid
app.jwt.audience=atch-api
app.jwt.access-token-ttl=PT15M
app.jwt.key-id=atch-test
app.auth.refresh-token-ttl=P14D
app.auth.email-code-ttl=PT5M
app.auth.email-resend-interval=PT1M
app.auth.email-proof-ttl=PT10M
spring.mail.username=verification@atch.invalid
spring.mail.test-connection=false
app.ai.claude.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO
logging.level.io.lettuce.core=INFO

app.report.settlement.enabled=false
app.ai.voyage.enabled=false

app.recurrence.scheduler.enabled=false
