
## Production Environment

# AWS RDS PostgreSQL 연결
# 운영 환경에서는 DB_URL 환경변수로 JDBC 주소 주입
spring.datasource.url=${DB_URL}
# RDS 데이터베이스 사용자 이름
spring.datasource.username=${DB_USERNAME}
# RDS 비밀번호는 운영 환경변수에서 참조
spring.datasource.password=${DB_PASSWORD}


## Redis

# EC2 Docker 내부에서 실행되는 Redis 컨테이너에 연결
spring.data.redis.host=${REDIS_HOST:redis}
# 컨테이너 간 통신에는 Redis 내부 포트 6379 사용
spring.data.redis.port=${REDIS_PORT:6379}


## HikariCP Connection Pool

# 데이터베이스 연결을 재사용하기 위한 커넥션 풀
# RDS 인스턴스의 제한된 메모리를 고려하여 최대 연결 수 제한
spring.datasource.hikari.maximum-pool-size=5
# 유휴 상태에서 최소한으로 유지할 연결 수
spring.datasource.hikari.minimum-idle=1

## Swagger / OpenAPI

# 운영 환경에서 API 문서 공개 비활성화
springdoc.api-docs.enabled=false
# 운영 환경에서 Swagger UI 비활성화
springdoc.swagger-ui.enabled=false