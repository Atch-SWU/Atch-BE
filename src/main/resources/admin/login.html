<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>운영진 로그인 · Atch!</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/admin/assets/admin.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/admin/items">Atch!</a>
    <h1>운영진 로그인</h1>
    <p class="intro">운영진으로 등록된 서비스 계정으로 로그인해 주세요.</p>
    <form id="login-form" action="/admin/login" method="post">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button class="primary" type="submit" disabled>로그인</button>
    </form>
  </main>
</body>
</html>
