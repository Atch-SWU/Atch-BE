
## Local Development Environment

# 로컬 Docker PostgreSQL 연결
# localhost:5432 -> PostgreSQL 컨테이너의 5432 포트
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atch}
# PostgreSQL 사용자 이름
spring.datasource.username=${DB_USERNAME:atch}
# DB 비밀번호는 .env의 환경변수에서 참조
spring.datasource.password=${DB_PASSWORD}


## Redis

# 로컬 Docker Redis 연결
spring.data.redis.host=${REDIS_HOST:localhost}
# Mac의 6380 포트를 컨테이너 내부 6379 포트로 연결
spring.data.redis.port=${REDIS_PORT:6380}


## Swagger / OpenAPI

# OpenAPI 명세 생성 활성화
springdoc.api-docs.enabled=true
# Swagger UI 활성화
springdoc.swagger-ui.enabled=true