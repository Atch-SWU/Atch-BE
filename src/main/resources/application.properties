
## Common Application Configuration

# 프로젝트 루트에 있는 .env 파일을 Properties 형식으로 불러옴
# 파일이 없는 환경에서도 실행할 수 있도록 optional 지정
# 참고: 파일 탐색 기준은 애플리케이션의 작업 디렉터리
spring.config.import=optional:file:.env[.properties]

# Spring Boot 애플리케이션 이름
spring.application.name=atch

# 쉼표로 구분한 브라우저 Origin 목록. 미리보기 주소나 localhost는 명시적으로 추가
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://atch-fe.vercel.app}

# 실행 환경에 따라 활성화할 Spring Profile 지정
spring.profiles.active=${SPRING_PROFILES_ACTIVE}


## JPA / Hibernate

# DB 스키마 생성 및 변경은 Flyway가 담당
# Hibernate는 엔티티와 기존 DB 스키마의 일치 여부만 검증
spring.jpa.hibernate.ddl-auto=validate
# OSIV(Open Session In View) 비활성화
# 웹 요청 처리 전체에 DB 영속성 컨텍스트가 열려 있지 않도록 설정
spring.jpa.open-in-view=false


## Flyway

# 애플리케이션 시작 시 Flyway 마이그레이션 실행
spring.flyway.enabled=true
# SQL 마이그레이션 파일 탐색 경로
spring.flyway.locations=classpath:db/migration


## Spring Boot Actuator

# HTTP로 접근 가능한 Actuator 엔드포인트를 health로 제한
# 서버 상태 확인에 사용
management.endpoints.web.exposure.include=health
# Health 응답에 DB 등 개별 구성 요소의 상세 정보를 노출하지 않음
management.endpoint.health.show-details=never


# JWT 발급자 및 대상
app.jwt.issuer=https://52-195-10-40.sslip.io
app.jwt.audience=atch-api

# Access Token 유효기간 15분
app.jwt.access-token-ttl=PT15M

# 서명 키 식별자
app.jwt.key-id=${JWT_KEY_ID}

# RSA 개인키 및 공개키 파일 위치
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}

# Refresh Token 최초 발급 기준 절대 만료기간 14일
app.auth.refresh-token-ttl=P14D


## Gmail SMTP

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

# SMTP 인증 및 STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 이메일 인코딩
spring.mail.default-encoding=UTF-8

# 메일 서버 응답 지연 방지
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 이메일 인증 정책
app.auth.email-code-ttl=PT5M
app.auth.email-resend-interval=PT1M
app.auth.email-proof-ttl=PT10M
app.auth.email-code-hmac-secret=${EMAIL_CODE_HMAC_SECRET}


## Claude API

# 운영 환경에서는 키를 등록하고 명시적으로 활성화하기 전까지 비활성화
app.ai.claude.enabled=${ANTHROPIC_ENABLED:false}
# Anthropic API 인증 및 모델
app.ai.claude.api-key=${ANTHROPIC_API_KEY:}
app.ai.claude.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
# 요청 제한
app.ai.claude.timeout=PT30S
app.ai.claude.max-output-tokens=256
app.ai.claude.max-allowed-output-tokens=2048

## Voyage API

# 키는 로컬·EC2 환경변수로만 제공한다. 실제 클라이언트 연결은 후속 AI 단계다.
app.ai.voyage.enabled=${VOYAGE_ENABLED:false}
app.ai.voyage.api-key=${VOYAGE_API_KEY:}
